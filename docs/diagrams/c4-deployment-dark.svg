<text x="710.0" y="474" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#9aa6b2">[Container: Pod: postgres, gateway, backup]</text>
