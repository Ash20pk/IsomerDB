# IsomerDB defaults, included from postgresql.conf.
# Citus must be first in shared_preload_libraries.
shared_preload_libraries = 'citus, pg_cron, pg_documentdb_core, pg_documentdb, pg_documentdb_distributed, pg_documentdb_extended_rum, pg_search, pg_trickle'

listen_addresses = '*'
wal_level = logical
max_replication_slots = 20
max_wal_senders = 20
max_worker_processes = 32

cron.database_name = 'postgres'

# PG 18 has no rum package; DocumentDB ships its own extended_rum.
documentdb.rum_library_load_option = 'require_documentdb_extended_rum'
documentdb.alternate_index_handler_name = 'extended_rum'

# Read-your-writes tokens will build on the Citus cluster clock (PRD FR-R3).
citus.enable_cluster_clock = on
