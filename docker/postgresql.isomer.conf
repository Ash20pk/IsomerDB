# IsomerDB defaults, included from postgresql.conf.
# Citus must be first in shared_preload_libraries.
shared_preload_libraries = 'citus, pg_stat_statements, pg_cron, pg_documentdb_core, pg_documentdb, pg_documentdb_distributed, pg_documentdb_extended_rum, pg_search, pg_trickle'

listen_addresses = '*'
wal_level = logical
max_replication_slots = 20
max_wal_senders = 20
max_worker_processes = 32

cron.database_name = 'postgres'
# Run jobs in background workers rather than over a localhost connection (which needs a password).
cron.use_background_workers = on
cron.max_running_jobs = 16

# Logical replication apply workers fire only row-level triggers, so pg_trickle must capture
# changes with row triggers for stream tables over attached tables to stay current.
pg_trickle.cdc_trigger_mode = 'row'
# Attach mode applies the source's ADD COLUMN here; pg_trickle extends its change buffers in place.
# Destructive changes still suspend the stream table, and IsomerDB pauses the attachment.
pg_trickle.block_source_ddl = off

# PG 18 has no rum package; DocumentDB ships its own extended_rum.
documentdb.rum_library_load_option = 'require_documentdb_extended_rum'
documentdb.alternate_index_handler_name = 'extended_rum'

# Read-your-writes tokens will build on the Citus cluster clock (PRD FR-R3).
citus.enable_cluster_clock = on

# Bounded projections may join tables that are not co-located; Citus runs those as repartition
# joins (sync projections still require co-location, checked at create time).
citus.enable_repartition_joins = on

# The proposer and shard advisor read query statistics (PRD FR-M1, FR-M6).
pg_stat_statements.track = top
citus.stat_statements_track = all
