# Every pull request and every push to main: the Go and TypeScript tests, then the images built
# (with a layer cache, since Citus, DocumentDB and pg_trickle compile from source) and every
# single-node acceptance suite run against them. The cluster suites and Jepsen run nightly.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Go and TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: |
            operator/go.sum
            controlplane/go.sum
      - name: Operator
        working-directory: operator
        run: go vet ./... && go test ./...
      - name: Control plane
        working-directory: controlplane
        run: go vet ./... && go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/package-lock.json
      - name: Clients
        working-directory: clients
        run: npm ci && npm run typecheck && npm run build && npm test
      - name: Third-party licenses are up to date
        run: |
          cargo install --locked cargo-about --version 0.9.2 --features cli
          go install github.com/google/go-licenses/v2@v2.0.1
          PATH="$(go env GOPATH)/bin:$PATH" ./scripts/third-party-licenses.sh --check

  single-node:
    name: Single-node suites
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the builds
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build the images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: db,api,embedder,edge
          load: true
          set: |
            db.cache-from=type=gha,scope=db
            db.cache-to=type=gha,scope=db,mode=max
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            embedder.cache-from=type=gha,scope=embedder
            embedder.cache-to=type=gha,scope=embedder,mode=max
            edge.cache-from=type=gha,scope=edge
            edge.cache-to=type=gha,scope=edge,mode=max
      - name: Run the suites
        env:
          ISOMER_SKIP_BUILD: "1"
        run: ./scripts/test-all.sh single
      - name: Logs on failure
        if: failure()
        run: docker compose --profile attach --profile test logs --tail 200
