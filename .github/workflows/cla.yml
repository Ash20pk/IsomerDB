# Asks each first-time contributor to accept CLA.md by commenting on their pull request, and
# keeps the signatures on the cla-signatures branch. A pull request can't merge until its authors
# have signed.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    steps:
      - if: github.event_name == 'pull_request_target' || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') || github.event.comment.body == 'recheck'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: Ash20pk,dependabot[bot]
