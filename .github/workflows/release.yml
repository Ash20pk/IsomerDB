# A tag vX.Y.Z: every image built for amd64 and arm64 (on native runners) and pushed to ghcr.io,
# tagged X.Y.Z, X.Y and latest; and a GitHub release with the operator's install manifest, its
# images pointing at those tags. The tag must match the isomer extension's default_version.
# (The cloud control plane is not released: a managed IsomerDB is on hold.)
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/ash20pk

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=${GITHUB_REF_NAME#v}
          ext=$(sed -n "s/^default_version = '\(.*\)'/\1/p" extensions/isomer/isomer.control)
          if [ "$version" != "$ext" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but extensions/isomer/isomer.control is at $ext"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: isomerdb, context: ., file: docker/Dockerfile }
          - { name: isomer-api, context: ., file: services/api/Dockerfile }
          - { name: isomer-embedder, context: ., file: services/embedder/Dockerfile }
          - { name: isomer-edge, context: ., file: services/edge/Dockerfile }
          - { name: isomerdb-operator, context: operator, file: operator/Dockerfile }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the builds
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=release-${{ matrix.image.name }}-${{ matrix.platform.arch }},mode=max
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.image.name }}-${{ matrix.platform.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag each image for both architectures
        run: |
          minor=${VERSION%.*}
          for name in isomerdb isomer-api isomer-embedder isomer-edge isomerdb-operator; do
            docker buildx imagetools create \
              -t "$REGISTRY/$name:$VERSION" -t "$REGISTRY/$name:$minor" -t "$REGISTRY/$name:latest" \
              "$REGISTRY/$name@$(cat /tmp/digests/$name-amd64)" "$REGISTRY/$name@$(cat /tmp/digests/$name-arm64)"
          done
      - name: The operator's install manifest
        run: |
          kubectl kustomize operator/config \
            | sed -e "s#\bisomerdb-operator:dev\b#$REGISTRY/isomerdb-operator:$VERSION#g" \
                  -e "s#\bisomerdb:dev\b#$REGISTRY/isomerdb:$VERSION#g" \
                  -e "s#\bisomer-api:dev\b#$REGISTRY/isomer-api:$VERSION#g" \
                  -e "s#\bisomer-embedder:dev\b#$REGISTRY/isomer-embedder:$VERSION#g" \
            > isomerdb-operator.yaml
          if grep -n ':dev\b' isomerdb-operator.yaml; then echo "::error::a :dev image is left in the manifest"; exit 1; fi
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Images, for amd64 and arm64:"
            echo
            for name in isomerdb isomer-api isomer-embedder isomer-edge isomerdb-operator; do
              echo "- \`$REGISTRY/$name:$VERSION\`"
            done
            echo
            echo "Install the Kubernetes operator: \`kubectl apply --server-side -f https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/isomerdb-operator.yaml\`"
            echo
            echo "What changed, and why, is in [docs/engineering-notes.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/engineering-notes.md). Self-hosting: [docs/self-hosting.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/self-hosting.md)."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" isomerdb-operator.yaml --title "IsomerDB $VERSION" --notes-file notes.md --generate-notes
