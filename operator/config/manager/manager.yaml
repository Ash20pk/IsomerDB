apiVersion: v1
kind: Namespace
metadata:
  name: isomerdb-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: isomerdb-operator
  namespace: isomerdb-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: isomerdb-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: isomerdb-operator
subjects:
  - kind: ServiceAccount
    name: isomerdb-operator
    namespace: isomerdb-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isomerdb-operator
  namespace: isomerdb-system
  labels:
    app.kubernetes.io/name: isomerdb-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: isomerdb-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: isomerdb-operator
    spec:
      serviceAccountName: isomerdb-operator
      securityContext:
        runAsNonRoot: true
      containers:
        - name: operator
          image: isomerdb-operator:dev
          imagePullPolicy: IfNotPresent
          args: ["--leader-elect=false"]
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: probes, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
