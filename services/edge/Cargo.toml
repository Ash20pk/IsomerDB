[package]
name = "isomer-edge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Serves IsomerDB projections close to users: a replica fed by the origin cluster's change feed"
publish = false

[dependencies]
anyhow = "1"
axum = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
