# Local single-node IsomerDB: Postgres on 5432, MongoDB wire gateway on 10260.
#   docker compose up --build
#
# The gateway reaches Postgres over its Unix socket (shared volume), because the DocumentDB
# gateway only supports password-less local connections to Postgres.
services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: isomerdb:dev
    environment:
      POSTGRES_PASSWORD: isomer
      ISOMER_MONGO_USER: isomer
      ISOMER_MONGO_PASSWORD: isomer
      ISOMER_COORDINATOR_HOST: db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - pgsocket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost && psql -U postgres -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'documentdb'\" | grep -q 1"]
      interval: 5s
      retries: 60

  gateway:
    image: isomerdb:dev
    depends_on:
      db:
        condition: service_healthy
    command: ["documentdb_gateway", "/etc/isomerdb/gateway.json"]
    environment:
      # 1: a read of a projection waits for the client's gossiped $clusterTime (implicit causal reads).
      ISOMER_IMPLICIT_CAUSAL: ${ISOMER_IMPLICIT_CAUSAL:-0}
    volumes:
      - pgsocket:/var/run/postgresql
    ports:
      - "10260:10260"

  # Computes embeddings for vector projections, outside Postgres. API keys come from the
  # environment variables named in isomer.embedding_models.api_key_env.
  embedder:
    build:
      context: .
      dockerfile: services/embedder/Dockerfile
    image: isomer-embedder:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      ISOMER_DATABASE_URL: host=/var/run/postgresql user=postgres dbname=postgres
      MOCKAI_KEY: test-key
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Provider batches are checked every 30 seconds by default; tests want answers sooner.
      ISOMER_BATCH_POLL_SECONDS: ${ISOMER_BATCH_POLL_SECONDS:-2}
    volumes:
      - pgsocket:/var/run/postgresql

  # Serves projections over HTTP: key lookup, time travel, change feeds, live streams (SSE).
  # Requests carry an API key from isomer.create_api_key(name, role).
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: isomer-api:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      ISOMER_DATABASE_URL: host=/var/run/postgresql user=postgres dbname=postgres
      ISOMER_CLUSTER_NAME: local
      ISOMER_ALERT_INTERVAL_SECS: "5"
      # Secrets alert channels name (isomer.add_alert_channel(..., secret_env => ...)); test values.
      HOOK_TOKEN: ${HOOK_TOKEN:-test-hook-token}
      PD_ROUTING_KEY: ${PD_ROUTING_KEY:-test-routing-key}
    volumes:
      - pgsocket:/var/run/postgresql
    ports:
      - "8080:8080"

  # A stand-in OpenAI-compatible embeddings API, for tests (rate-limits every 5th request).
  mockai:
    image: python:3.12-alpine
    profiles: ["attach", "test"]
    command: ["python", "/srv/server.py"]
    environment:
      RATE_LIMIT_EVERY: "3"
    volumes:
      - ./tests/mockai/server.py:/srv/server.py:ro

  # Records webhook, Slack and PagerDuty deliveries for the alert tests.
  mockhooks:
    image: python:3.12-alpine
    profiles: ["test"]
    command: ["python", "/srv/server.py"]
    ports:
      - "8090:8090"
    volumes:
      - ./tests/mockhooks/server.py:/srv/server.py:ro

  # Citus worker nodes, for multi-node clusters:
  #   docker compose --profile cluster up -d   then   SELECT isomer.add_node('worker1');
  worker1:
    image: isomerdb:dev
    profiles: ["cluster"]
    environment:
      POSTGRES_PASSWORD: isomer
      ISOMER_ROLE: worker
      # Workers are reachable only on the compose network, and Citus connects to them as each
      # client's own role (e.g. a MongoDB user's). Dev only: production uses certificate auth
      # (citus.node_conninfo) or pg_dist_authinfo.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - worker1data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost && psql -U postgres -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'isomer'\" | grep -q 1"]
      interval: 5s
      retries: 60

  worker2:
    image: isomerdb:dev
    profiles: ["cluster"]
    environment:
      POSTGRES_PASSWORD: isomer
      ISOMER_ROLE: worker
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - worker2data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost && psql -U postgres -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'isomer'\" | grep -q 1"]
      interval: 5s
      retries: 60

  # Stand-in for a customer's existing Postgres, used to develop and test attach mode.
  #   docker compose --profile attach up -d source
  source:
    image: postgres:18.6-bookworm
    profiles: ["attach"]
    environment:
      POSTGRES_PASSWORD: source
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 30

volumes:
  pgdata:
  pgsocket:
  worker1data:
  worker2data:
