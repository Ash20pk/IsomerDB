# Local single-node IsomerDB: Postgres on 5432, MongoDB wire gateway on 10260.
#   docker compose up --build
#
# The gateway reaches Postgres over its Unix socket (shared volume), because the DocumentDB
# gateway only supports password-less local connections to Postgres.
services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: isomerdb:dev
    environment:
      POSTGRES_PASSWORD: isomer
      ISOMER_MONGO_USER: isomer
      ISOMER_MONGO_PASSWORD: isomer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - pgsocket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost && psql -U postgres -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'documentdb'\" | grep -q 1"]
      interval: 5s
      retries: 60

  gateway:
    image: isomerdb:dev
    depends_on:
      db:
        condition: service_healthy
    command: ["documentdb_gateway", "/etc/isomerdb/gateway.json"]
    volumes:
      - pgsocket:/var/run/postgresql
    ports:
      - "10260:10260"

  # Computes embeddings for vector projections, outside Postgres. API keys come from the
  # environment variables named in isomer.embedding_models.api_key_env.
  embedder:
    build:
      context: .
      dockerfile: services/embedder/Dockerfile
    image: isomer-embedder:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      ISOMER_DATABASE_URL: host=/var/run/postgresql user=postgres dbname=postgres
      MOCKAI_KEY: test-key
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - pgsocket:/var/run/postgresql

  # A stand-in OpenAI-compatible embeddings API, for tests (rate-limits every 5th request).
  mockai:
    image: python:3.12-alpine
    profiles: ["attach", "test"]
    command: ["python", "/srv/server.py"]
    environment:
      RATE_LIMIT_EVERY: "3"
    volumes:
      - ./tests/mockai/server.py:/srv/server.py:ro

  # Stand-in for a customer's existing Postgres, used to develop and test attach mode.
  #   docker compose --profile attach up -d source
  source:
    image: postgres:18.6-bookworm
    profiles: ["attach"]
    environment:
      POSTGRES_PASSWORD: source
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 30

volumes:
  pgdata:
  pgsocket:
